name: Go CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.3

      - name: Install dependencies
        run: go install ./...

      - name: Test
        env:
          REDIS_ADDR: "localhost:6379"
        run: |
          go test -v -race -cover './...' -coverprofile=coverage.out 
          go tool cover -func=coverage.out

